<h2 class="wp-block-heading has-custom-titulo">Qué es la herencia yacente</h2>
<!-- /wp:heading -->

<!-- wp:paragraph -->
<p>La herencia yacente es la situación en la que queda el patrimonio de una persona fallecida mientras los herederos no la aceptan.</p>
<!-- /wp:paragraph -->

<!-- wp:paragraph -->
<p>Durante ese tiempo el patrimonio no tiene titular, pero sí tiene obligaciones fiscales.</p>
<!-- /wp:paragraph -->
