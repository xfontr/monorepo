packages:
    - "packages/*"
    - "apps/*"
    - "infrastructure/*"

catalog:
    # Frameworks
    "@nuxt/fonts": 0.14.0
    "@nuxtjs/i18n": 10.5.0
    nuxt: ^4.5.1
    vue-tsc: ^3.3.0
    vue: ^3.5.38
    vite: ^8.0.16

    # TS
    typescript: ^6.0.3
    "@types/node": ^25.9.1

    # Testing
    # @vitest/coverage-v8 declares an exact peer on vitest, so a caret range on both still lets
    # pnpm resolve each independently to its own latest and land on two different patches. Pinned
    # to the exact version vitest is on; bump both together, never one alone.
    vitest: ^4.1.11
    "@vitest/coverage-v8": 4.1.11

    # Misc
    eslint: ^10.4.1

    # Infra
    hono: ^4.13.5
    "@hono/node-server": ^1.14.0

# Patches for pnpm audit advisories on packages none of the projects depend on directly.
overrides:
    axios: ">=1.18.0"
    qs: ">=6.16.0"
    fast-uri: ">=3.1.6"
    js-yaml: ">=4.3.2"
    nanoid: ">=3.3.18"
    svgo: ">=4.1.0"
    postcss: ">=8.5.23"
    "brace-expansion@>=2.0.0 <2.1.4": ">=2.1.4"
    "brace-expansion@>=3.0.0 <5.0.9": ">=5.0.9"
    nx: ">=23.0.2"
    "@nuxt/devtools": ">=3.3.1"
    tar: ">=7.5.21"
    browserslist: ">=4.28.7"
    baseline-browser-mapping: ">=2.11.0"
    postcss-selector-parser: ">=7.1.3"
    esbuild: ">=0.28.1"
    # pnpm 10.7.1's catalog resolver won't budge this off 4.1.7 without a hard override — an exact
    # catalog pin isn't enough, likely a peer-resolution quirk specific to this pnpm version.
    "@vitest/coverage-v8": "4.1.11"
