      tickets.
  design-approval:
    status: done
    on: 2026-09-30
    note: Design D chosen on 2026-09-30 in #208.
  go-live:
    status: done
    on: 2026-11-04
    note: Approved for the cutover on 2026-11-04.
  feature-inventory:
    status: skipped
    note: Never done; comments, the about page and the confirmation page were found
      late.
  brand-extraction:
    status: done
    on: 2026-09-29
    note: Transcribed by hand from a Penpot sheet, before the lab existed.
  component-inventory:
    status: done
    on: 2026-10-02
    note: The kits the approved lab pages rendered, listed in the old implementation
      plan.
  app-scaffold:
    status: done
    on: 2026-09-04
    note: Renamed from apps/external on 2026-09-04.
  spam-protection:
    status: done
    on: 2026-10-29
    note: Turnstile and the honeypot landed inside the newsletter and contact
      tickets.
  accessibility:
    status: done
    on: 2026-11-04
