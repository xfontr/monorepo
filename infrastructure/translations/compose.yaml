name: budget-forecast

services:
    tms:
        build:
            context: ../..
            dockerfile: infrastructure/translations/Dockerfile
            target: runtime
        image: budget-forecast/tms:local
        container_name: budget-forecast-tms
        init: true
        restart: unless-stopped
        ports:
            - "127.0.0.1:4000:4000"
        environment:
            PORT: "4000"
        volumes:
            - ./projects:/app/projects:ro
