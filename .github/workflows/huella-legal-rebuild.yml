name: Huella Legal rebuild

# Prerendered pages only change on a build, and corrections to old posts arrive with no commit.
on:
    schedule:
        - cron: "0 5 * * 1"
    workflow_dispatch:

permissions: {}

jobs:
    rebuild:
        runs-on: ubuntu-latest
        steps:
            # A deploy hook starts a manual build of its branch, so it builds even with no new commit.
            - run: curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK_URL"
              env:
                  DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
