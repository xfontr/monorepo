name: Release

on:
    workflow_dispatch:
        inputs:
            dry-run:
                description: Run nx release without committing anything
                type: boolean
                default: true
            first-release:
                description: First release of a project (no git tags to compare against yet)
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Configure git user
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Version and generate changelogs from conventional commits
              run: >-
                  pnpm exec nx release --skip-publish
                  ${{ inputs.dry-run && '--dry-run' || '' }}
                  ${{ inputs.first-release && '--first-release' || '' }}

            - name: Push release commit and tags
              if: ${{ !inputs.dry-run }}
              run: git push --follow-tags
