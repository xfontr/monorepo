name: Release

on:
    workflow_dispatch:
        inputs:
            dry-run:
                description: Run nx release without committing anything
                type: boolean
                default: true
            first-release:
                description: First release of a project (no git tags to compare against yet)
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Configure git user
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Version and generate changelogs from conventional commits
              run: >-
                  pnpm exec nx release --skip-publish
                  ${{ inputs.dry-run && '--dry-run' || '' }}
                  ${{ inputs.first-release && '--first-release' || '' }}

            - name: Push release commit and tags
              if: ${{ !inputs.dry-run }}
              run: git push --follow-tags
