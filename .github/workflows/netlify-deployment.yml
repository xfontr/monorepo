name: Netlify deployment

on:
    push:
        branches: [master]
    pull_request:
    # Prerendered pages only change on a build, and corrections to old posts arrive with no commit.
    schedule:
        - cron: "0 5 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: netlify-deployment-${{ github.event.pull_request.number || 'production' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NETLIFY_CLI: netlify-cli@27.16.2

jobs:
    huella-legal:
        runs-on: ubuntu-latest
        permissions:
            deployments: write
        env:
            NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
            NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # Always runs and passes, since a required check that never reports blocks the PR.
            - id: changes
              env:
                  BEFORE: ${{ github.event.before }}
                  BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  case "$GITHUB_EVENT_NAME" in
                      schedule | workflow_dispatch)
                          changed=true ;;
                      pull_request)
                          # Fork and Dependabot PRs get no repo secrets.
                          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
                              echo "::notice::No Netlify token on this run, so no preview."
                              changed=false
                          elif CONTEXT=deploy-preview NETLIFY_IGNORE_BASE="$BASE" \
                              bash apps/huella-legal/netlify-ignore.sh "" "$GITHUB_SHA"; then
                              changed=false
                          else
                              changed=true
                          fi ;;
                      *)
                          if bash apps/huella-legal/netlify-ignore.sh "$BEFORE" "$GITHUB_SHA"; then
                              changed=false
                          else
                              changed=true
                          fi ;;
                  esac
                  echo "build=$changed" >> "$GITHUB_OUTPUT"
                  if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
                      echo "context=deploy-preview" >> "$GITHUB_OUTPUT"
                  else
                      echo "context=production" >> "$GITHUB_OUTPUT"
                  fi

            - if: steps.changes.outputs.build == 'true'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - if: steps.changes.outputs.build == 'true'
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - if: steps.changes.outputs.build == 'true'
              run: pnpm install --frozen-lockfile --ignore-scripts

            # The build command and publish directory come from the Netlify project, and so do the
            # env vars for `--context`. One command, because `--no-build` uploads without the config
            # the build writes, such as the image CDN's allowed remote hosts.
            - if: steps.changes.outputs.build == 'true'
              env:
                  CONTEXT: ${{ steps.changes.outputs.context }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  # The prerender reads live WordPress, which no task hash covers.
                  NX_SKIP_NX_CACHE: "true"
                  # std-env detects GitHub Actions before Netlify, so both would fall back to
                  # `node-server` and a local `ipx` that fetches every image during the prerender.
                  NITRO_PRESET: netlify
                  NUXT_IMAGE_PROVIDER: netlifyImageCdn
              run: |
                  if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
                      target=(--alias "pr-$PR_NUMBER")
                  else
                      target=(--prod)
                  fi
                  npx --yes "$NETLIFY_CLI" deploy "${target[@]}" --context "$CONTEXT" \
                      --filter @monorepo/huella-legal --message "$GITHUB_EVENT_NAME ${GITHUB_SHA::7}"

            - if: steps.changes.outputs.build == 'true'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  NETLIFY_PRODUCTION_URL: ${{ vars.NETLIFY_PRODUCTION_URL }}
              with:
                  script: |
                      const response = await fetch(
                          `https://api.netlify.com/api/v1/sites/${process.env.NETLIFY_SITE_ID}`,
                          { headers: { Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}` } }
                      );
                      if (!response.ok) {
                          throw new Error(`Netlify API returned ${response.status}: ${await response.text()}`);
                      }
                      const site = await response.json();
                      const preview = context.eventName === "pull_request";
                      const environment = preview ? "huella-legal-preview" : "huella-legal";
                      const url = preview
                          ? `https://pr-${context.payload.pull_request.number}--${site.name}.netlify.app`
                          : process.env.NETLIFY_PRODUCTION_URL || site.ssl_url;

                      const { data: deployment } = await github.rest.repos.createDeployment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: preview ? context.payload.pull_request.head.sha : context.sha,
                          environment,
                          auto_merge: false,
                          required_contexts: [],
                          production_environment: !preview,
                          transient_environment: preview,
                      });

                      await github.rest.repos.createDeploymentStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          deployment_id: deployment.id,
                          state: "success",
                          environment,
                          environment_url: url,
                      });

                      if (preview) return;

                      // A deploy empties the CDN, and a cold listing render pages through every
                      // WordPress post, so the runner pays for it once and the durable cache serves
                      // every edge after that.
                      const get = (path) => fetch(new URL(path, url), { signal: AbortSignal.timeout(30_000) });

                      try {
                          const sitemap = await (await get("/sitemap.xml")).text();
                          // The sitemap's `<loc>`s carry the site URL, which needn't be this host
                          const listings = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)]
                              .map(([, loc]) => new URL(loc).pathname)
                              .filter((path) => /^\/(areas|colaboradores)\/[^/]+\/$/.test(path));
                          const paths = ["/publicaciones/", "/buscar/", ...listings].flatMap((path) => [
                              path,
                              `${path}_payload.json`,
                          ]);

                          for (let i = 0; i < paths.length; i += 4) {
                              const batch = paths.slice(i, i + 4);
                              const results = await Promise.allSettled(
                                  batch.map(async (path) => {
                                      const response = await get(path);
                                      await response.arrayBuffer();
                                      return response.status;
                                  })
                              );
                              results.forEach((result, j) =>
                                  result.status === "fulfilled"
                                      ? core.info(`${result.value} ${batch[j]}`)
                                      : core.warning(`${batch[j]}: ${result.reason}`)
                              );
                          }
                      } catch (error) {
                          core.warning(`Cache warm-up stopped: ${error.message}`);
                      }
