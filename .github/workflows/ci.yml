name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile --ignore-scripts

            - run: pnpm --filter @monorepo/huella-legal exec nuxi prepare

            - run: pnpm --filter @monorepo/tech-docs exec nuxi prepare

            - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
              with:
                  main-branch-name: master

            - run: pnpm exec nx affected -t lint typecheck test build

            # Not an Nx target and deliberately not `affected`: the map indexes every project at
            # once, so "nothing changed here" is never a reason to skip it. Adding a script, hook,
            # workflow or skill without re-rendering fails this step.
            - run: pnpm docs:map --check
